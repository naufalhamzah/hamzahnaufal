<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1067" viewBox="0 0 800 1067" role="img" aria-label="Placeholder image: Profile photo">
  <defs>
    <pattern id="hatch-portrait" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="1.25" opacity="0.32"/>
    </pattern>
    <pattern id="dots-portrait" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="1067" fill="#f1f5f9"/>
  <rect width="800" height="1067" fill="url(#dots-portrait)"/>
  <rect width="800" height="1067" fill="url(#hatch-portrait)"/>

  <!-- dashed frame -->
  <rect x="18" y="18" width="764" height="1031" fill="none"
        stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.75"/>

  <!-- corner ticks -->
  <g stroke="#64748b" stroke-width="4" opacity="0.5">
    <line x1="18" y1="18" x2="70" y2="18"/><line x1="18" y1="18" x2="18" y2="70"/>
    <line x1="782" y1="18" x2="730" y2="18"/><line x1="782" y1="18" x2="782" y2="70"/>
    <line x1="18" y1="1049" x2="70" y2="1049"/><line x1="18" y1="1049" x2="18" y2="997"/>
    <line x1="782" y1="1049" x2="730" y2="1049"/><line x1="782" y1="1049" x2="782" y2="997"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="304" y="202.73" width="192" height="38" rx="19"
          fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.9"/>
    <text x="400" y="228.73" text-anchor="middle"
          font-family="'JetBrains Mono', Consolas, monospace" font-size="19"
          letter-spacing="2.5" fill="#64748b">PLACEHOLDER</text>
  </g>

  <!-- label -->
  <text x="400" y="554.84" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="55" font-weight="600" fill="#64748b">Profile photo</text>

  <!-- note -->
  <text x="400" y="960" text-anchor="middle"
        font-family="'JetBrains Mono', Consolas, monospace" font-size="34"
        fill="#94a3b8">Replace with a professional photo</text>
</svg>
