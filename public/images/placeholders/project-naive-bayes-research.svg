<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-label="Placeholder image: Naive Bayes Sentiment Analysis">
  <defs>
    <pattern id="hatch-research" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="1.25" opacity="0.32"/>
    </pattern>
    <pattern id="dots-research" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1000" height="750" fill="#f1f5f9"/>
  <rect width="1000" height="750" fill="url(#dots-research)"/>
  <rect width="1000" height="750" fill="url(#hatch-research)"/>

  <!-- dashed frame -->
  <rect x="18" y="18" width="964" height="714" fill="none"
        stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.75"/>

  <!-- corner ticks -->
  <g stroke="#64748b" stroke-width="4" opacity="0.5">
    <line x1="18" y1="18" x2="70" y2="18"/><line x1="18" y1="18" x2="18" y2="70"/>
    <line x1="982" y1="18" x2="930" y2="18"/><line x1="982" y1="18" x2="982" y2="70"/>
    <line x1="18" y1="732" x2="70" y2="732"/><line x1="18" y1="732" x2="18" y2="680"/>
    <line x1="982" y1="732" x2="930" y2="732"/><line x1="982" y1="732" x2="982" y2="680"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="404" y="142.5" width="192" height="38" rx="19"
          fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.9"/>
    <text x="500" y="168.5" text-anchor="middle"
          font-family="'JetBrains Mono', Consolas, monospace" font-size="19"
          letter-spacing="2.5" fill="#64748b">PLACEHOLDER</text>
  </g>

  <!-- label -->
  <text x="500" y="390" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="39" font-weight="600" fill="#64748b">Naive Bayes Sentiment Analysis</text>

  <!-- note -->
  <text x="500" y="675" text-anchor="middle"
        font-family="'JetBrains Mono', Consolas, monospace" font-size="24"
        fill="#94a3b8">Replace with a real image — 1000x750px (4/3)</text>
</svg>
